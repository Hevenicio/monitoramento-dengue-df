[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dengue-df"
version = "0.3.0"
description = "Previsão probabilística de dengue para o DF e Entorno, com painel de risco"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mosqlient>=1.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pyarrow>=15",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
painel = ["streamlit>=1.50", "plotly>=5.20"]
dev = ["pytest>=8"]

[project.scripts]
dengue-df = "dengue_df.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
